name: Daily Bull-etin

on:
  schedule:
    # 12:45 UTC = 5:45 AM PDT / 4:45 AM PST — before NYSE opens (13:30/14:30 UTC)
    - cron: "45 12 * * 1-5"
    # 02:30 UTC = 8:00 AM IST — before NSE opens at 9:15 IST (03:45 UTC)
    - cron: "30 2 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "Which market to run"
        type: choice
        options: [us, india, both]
        default: both

concurrency:
  group: daily-bulletin
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick market for this trigger
        id: market
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "market=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 2 * * 1-5" ]; then
            echo "market=india" >> "$GITHUB_OUTPUT"
          else
            echo "market=us" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily.py --market "${{ steps.market.outputs.market }}"

      - name: Refresh scorecard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python track.py

      - name: Commit state back (pick log, caches, reports)
        run: |
          git config user.name "daily-bulletin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "digest: ${{ steps.market.outputs.market }} $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
